<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interaction and motion studies built with raw WebGL 2.0.">
  <meta name="theme-color" content="#060708">
  <title>WebGL2 Interaction Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-prev" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-next" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.2v9.6L12.5 8z" fill="currentColor"/></symbol>
    <symbol id="i-reset" viewBox="0 0 16 16"><path d="M3.2 8a4.8 4.8 0 1 0 1.4-3.4M3.5 2.5v2.6h2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-shot" viewBox="0 0 16 16"><path d="M2.5 5h2.2l1.2-1.6h4.2L11.3 5h2.2v7.5h-11z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8.6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-rec" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="currentColor"/></symbol>
    <symbol id="i-full" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  </svg>

  <header class="masthead">
    <a class="wordmark" href="#" aria-label="WebGL2 Interaction Lab">
      <span class="mark" aria-hidden="true"><i></i><i></i></span>
      <span class="wm-text">Interaction <em>Lab</em></span>
      <span class="wm-sub">WebGL&nbsp;2.0</span>
    </a>
    <div class="mast-meta">
      <span class="status" id="gl-status"><i></i><span>Checking context</span></span>
      <a class="back" href="../index.html">Portfolio <span aria-hidden="true">↗</span></a>
    </div>
  </header>

  <nav class="groupnav" id="groupnav" aria-label="Demos by group">
    <button class="gn-arrow gn-left" type="button" aria-label="Scroll groups left"><svg><use href="#i-prev"/></svg></button>
    <div class="gn-scroller" id="gn-scroller">
      <div class="gn-track" id="gn-track"></div>
      <span class="gn-indicator" id="gn-indicator" aria-hidden="true"></span>
    </div>
    <button class="gn-arrow gn-right" type="button" aria-label="Scroll groups right"><svg><use href="#i-next"/></svg></button>
  </nav>

  <section class="view-grid" id="view-grid" aria-live="polite">
    <header class="grid-head">
      <div class="gh-letter" id="gh-letter">A</div>
      <div class="gh-text">
        <div class="gh-kicker"><span id="gh-index">Group 01 / 09</span><span id="gh-count">—</span></div>
        <h1 id="gh-title">—</h1>
        <p id="gh-desc" class="gh-desc"></p>
      </div>
    </header>
    <div class="masonry" id="masonry"></div>
    <footer class="grid-foot">
      <a id="gf-prev" class="gf" href="#"><small>Previous group</small><span></span></a>
      <a id="gf-next" class="gf next" href="#"><small>Next group</small><span></span></a>
    </footer>
  </section>

  <div class="app" id="view-demo">
    <main class="stage-col">
      <div class="crumbs">
        <a id="crumb-back" href="#"><svg><use href="#i-prev"/></svg><span id="crumb-group">All studies</span></a>
        <span class="crumb-pos" id="crumb-pos"></span>
      </div>
      <div class="stage" id="stage">
        <canvas id="gl" tabindex="0" aria-label="Interactive WebGL canvas"></canvas>
        <div id="overlay" class="overlay"></div>
        <div id="message" class="message" hidden></div>
        <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>
        <div class="scan" id="scan" aria-hidden="true"></div>

        <div class="hud hud-top">
          <div class="hud-id"><span id="hud-num">01</span><span class="sep">/</span><span id="hud-total">16</span><span class="hud-name" id="hud-title">—</span></div>
          <div class="hud-read">
            <span class="readout"><b>x</b><span id="rd-x">0.000</span></span>
            <span class="readout"><b>y</b><span id="rd-y">0.000</span></span>
            <span class="readout fps"><canvas id="spark" width="72" height="18" aria-hidden="true"></canvas><span id="fps">0</span><small>fps</small></span>
          </div>
        </div>
        <div class="hud hud-bottom">
          <span class="hud-hint" id="hud-hint"></span>
          <div class="toolbar">
            <button class="tool" id="btn-prev" title="Previous demo  [" aria-label="Previous demo"><svg><use href="#i-prev"/></svg></button>
            <button class="tool" id="btn-pause" title="Pause / resume" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
            <button class="tool" id="btn-reset" title="Restart demo" aria-label="Restart demo"><svg><use href="#i-reset"/></svg></button>
            <button class="tool" id="btn-shot" title="Save a PNG of this frame" aria-label="Save screenshot"><svg><use href="#i-shot"/></svg></button>
            <button class="tool" id="btn-rec" title="Record video (click again to stop, 30 s max)" aria-label="Record video"><svg><use href="#i-rec"/></svg></button>
            <button class="tool" id="btn-full" title="Fullscreen" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
            <button class="tool" id="btn-next" title="Next demo  ]" aria-label="Next demo"><svg><use href="#i-next"/></svg></button>
          </div>
        </div>
      </div>
    </main>

    <aside class="sheet" aria-label="Demo details and controls">
      <div class="sheet-head">
        <div class="numeral" id="info-num">01</div>
        <div class="sheet-kicker"><span id="info-letter">A</span><span id="info-cat">—</span></div>
        <h1 id="info-title">—</h1>
        <p id="info-desc" class="lede"></p>
      </div>

      <section class="sect">
        <h2><span>01</span>Interact</h2>
        <dl id="info-interact" class="interact"></dl>
      </section>
      <section class="sect">
        <h2><span>02</span>Parameters</h2>
        <div id="controls" class="controls"></div>
      </section>
      <section class="sect">
        <h2><span>03</span>Pipeline</h2>
        <ol id="info-features" class="pipeline"></ol>
      </section>
      <details class="sect device">
        <summary><h2><span>04</span>Device</h2><span class="plus" aria-hidden="true"></span></summary>
        <dl id="caps" class="caps"></dl>
      </details>

      <div class="pager">
        <a id="pg-prev" class="pg" href="#"><small>Previous</small><span></span></a>
        <a id="pg-next" class="pg next" href="#"><small>Next</small><span></span></a>
      </div>
      <p class="colophon">Raw WebGL&nbsp;2.0, no libraries. Keys <kbd>[</kbd> <kbd>]</kbd> step through studies.</p>
    </aside>
  </div>

  <script src="js/core.js"></script>
  <script src="js/demos/pointer-field.js"></script>

  <script src="js/demos/water.js"></script>
  <script src="js/demos/jelly.js"></script>
  <script src="js/demos/orbit.js"></script>
  <script src="js/demos/terrain.js"></script>
  <script src="js/demos/picking.js"></script>
  <script src="js/demos/swarm.js"></script>
  <script src="js/demos/particles.js"></script>
  <script src="js/demos/easing.js"></script>
  <script src="js/demos/morph.js"></script>
  <script src="js/demos/raymarch.js"></script>
  <script src="js/demos/volume.js"></script>

  <script src="js/demos/audio.js"></script>
  <script src="js/demos/painter.js"></script>
  <script src="js/demos/stencil.js"></script>
  <script src="js/demos/xr.js"></script>
  <script src="js/demos/fluid.js"></script>
  <script src="js/demos/flock.js"></script>
  <script src="js/demos/skinning.js"></script>
  <script src="js/demos/shadows.js"></script>
  <script src="js/demos/texarray.js"></script>
  <script src="js/demos/hdr.js"></script>
  <script src="js/demos/queries.js"></script>
  <script src="js/demos/worker.js"></script>
  <script src="js/demos/camera.js"></script>
  <script src="js/demos/gestures.js"></script>
  <script src="js/demos/pressure.js"></script>
  <script src="js/demos/sculpt.js"></script>
  <script src="js/demos/hover.js"></script>
  <script src="js/demos/fractal.js"></script>
  <script src="js/demos/globe.js"></script>
  <script src="js/demos/fps.js"></script>
  <script src="js/demos/lasso.js"></script>
  <script src="js/demos/gizmo.js"></script>
  <script src="js/demos/voxels.js"></script>
  <script src="js/demos/physics.js"></script>
  <script src="js/demos/typeparticles.js"></script>
  <script src="js/demos/path.js"></script>
  <script src="js/demos/transitions.js"></script>
  <script src="js/demos/scrollstory.js"></script>
  <script src="js/demos/voice.js"></script>
  <script src="js/demos/dataviz.js"></script>
  <script src="js/demos/curves.js"></script>
  <script src="js/demos/nodes.js"></script>
  <script src="js/demos/radial.js"></script>
  <script src="js/demos/panel.js"></script>
  <script src="js/demos/spatial.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
