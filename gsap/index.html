<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Every GSAP capability, as interactive studies: tweens, timelines, easing, ScrollTrigger, Flip, Draggable, SVG, text and physics plugins.">
  <meta name="theme-color" content="#060708">
  <title>GSAP Interaction Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-prev" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-next" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.2v9.6L12.5 8z" fill="currentColor"/></symbol>
    <symbol id="i-reset" viewBox="0 0 16 16"><path d="M3.2 8a4.8 4.8 0 1 0 1.4-3.4M3.5 2.5v2.6h2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-full" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  </svg>

  <header class="masthead">
    <a class="wordmark" href="#" aria-label="GSAP Interaction Lab">
      <span class="mark" aria-hidden="true"><i></i><i></i></span>
      <span class="wm-text">GSAP <em>Lab</em></span>
      <span class="wm-sub">GSAP</span>
    </a>
    <div class="mast-meta">
      <span class="status ok" id="lib-status"><i></i><span>GSAP</span></span>
      <a class="back" href="../labs.html">All sandboxes <span aria-hidden="true">↗</span></a>
    </div>
  </header>

  <nav class="groupnav" id="groupnav" aria-label="Studies by group">
    <button class="gn-arrow gn-left" type="button" aria-label="Scroll groups left"><svg><use href="#i-prev"/></svg></button>
    <div class="gn-scroller" id="gn-scroller">
      <div class="gn-track" id="gn-track"></div>
      <span class="gn-indicator" id="gn-indicator" aria-hidden="true"></span>
    </div>
    <button class="gn-arrow gn-right" type="button" aria-label="Scroll groups right"><svg><use href="#i-next"/></svg></button>
  </nav>

  <section class="view-grid" id="view-grid" aria-live="polite">
    <header class="grid-head">
      <div class="gh-letter" id="gh-letter">A</div>
      <div class="gh-text">
        <div class="gh-kicker"><span id="gh-index">Group 01</span><span id="gh-count">—</span></div>
        <h1 id="gh-title">—</h1>
        <p id="gh-desc" class="gh-desc"></p>
      </div>
    </header>
    <div class="masonry" id="masonry"></div>
    <footer class="grid-foot">
      <a id="gf-prev" class="gf" href="#"><small>Previous group</small><span></span></a>
      <a id="gf-next" class="gf next" href="#"><small>Next group</small><span></span></a>
    </footer>
  </section>

  <div class="app" id="view-demo">
    <main class="stage-col">
      <div class="crumbs">
        <a id="crumb-back" href="#"><svg><use href="#i-prev"/></svg><span id="crumb-group">All studies</span></a>
        <span class="crumb-pos" id="crumb-pos"></span>
      </div>
      <div class="stage" id="stage">
        <div class="root" id="root"></div>
        <div id="message" class="message" hidden></div>
        <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>
        <div class="scan" id="scan" aria-hidden="true"></div>
        <div class="hud hud-top">
          <div class="hud-id"><span id="hud-num">01</span><span class="sep">/</span><span id="hud-total">00</span><span class="hud-name" id="hud-title">—</span></div>
          <div class="hud-read"><span class="readout fps"><canvas id="spark" width="72" height="18" aria-hidden="true"></canvas><span id="fps">0</span><small>fps</small></span></div>
        </div>
        <div class="hud hud-bottom">
          <span class="hud-hint" id="hud-hint"></span>
          <div class="toolbar">
            <button class="tool" id="btn-prev" title="Previous study  [" aria-label="Previous study"><svg><use href="#i-prev"/></svg></button>
            <button class="tool" id="btn-pause" title="Pause / resume all animation" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
            <button class="tool" id="btn-reset" title="Restart study" aria-label="Restart study"><svg><use href="#i-reset"/></svg></button>
            <button class="tool" id="btn-full" title="Fullscreen" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
            <button class="tool" id="btn-next" title="Next study  ]" aria-label="Next study"><svg><use href="#i-next"/></svg></button>
          </div>
        </div>
      </div>
    </main>

    <aside class="sheet" aria-label="Study details and controls">
      <div class="sheet-head">
        <div class="numeral" id="info-num">01</div>
        <div class="sheet-kicker"><span id="info-letter">A</span><span id="info-cat">—</span></div>
        <h1 id="info-title">—</h1>
        <p id="info-desc" class="lede"></p>
      </div>
      <section class="sect"><h2><span>01</span>Interact</h2><dl id="info-interact" class="interact"></dl></section>
      <section class="sect"><h2><span>02</span>Parameters</h2><div id="controls" class="controls"></div></section>
      <section class="sect"><h2><span>03</span>API used</h2><ol id="info-features" class="pipeline"></ol></section>
      <section class="sect"><h2><span>04</span>Code</h2><pre id="info-code" class="code"></pre></section>
      <div class="pager">
        <a id="pg-prev" class="pg" href="#"><small>Previous</small><span></span></a>
        <a id="pg-next" class="pg next" href="#"><small>Next</small><span></span></a>
      </div>
      <p class="colophon">GSAP <span id="gsap-ver"></span>, all plugins bundled locally. Keys <kbd>[</kbd> <kbd>]</kbd> step through studies.</p>
    </aside>
  </div>

  <!-- GSAP core + every plugin -->
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/ScrollSmoother.min.js"></script>
  <script src="vendor/ScrollToPlugin.min.js"></script>
  <script src="vendor/Observer.min.js"></script>
  <script src="vendor/Draggable.min.js"></script>
  <script src="vendor/InertiaPlugin.min.js"></script>
  <script src="vendor/Flip.min.js"></script>
  <script src="vendor/MotionPathPlugin.min.js"></script>
  <script src="vendor/MotionPathHelper.min.js"></script>
  <script src="vendor/MorphSVGPlugin.min.js"></script>
  <script src="vendor/DrawSVGPlugin.min.js"></script>
  <script src="vendor/SplitText.min.js"></script>
  <script src="vendor/ScrambleTextPlugin.min.js"></script>
  <script src="vendor/TextPlugin.min.js"></script>
  <script src="vendor/Physics2DPlugin.min.js"></script>
  <script src="vendor/PhysicsPropsPlugin.min.js"></script>
  <script src="vendor/CustomEase.min.js"></script>
  <script src="vendor/CustomBounce.min.js"></script>
  <script src="vendor/CustomWiggle.min.js"></script>
  <script src="vendor/EasePack.min.js"></script>
  <script src="vendor/CSSRulePlugin.min.js"></script>
  <script src="vendor/GSDevTools.min.js"></script>
  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/easeljs.min.js"></script>
  <script src="vendor/PixiPlugin.min.js"></script>
  <script src="vendor/EaselPlugin.min.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/studies/tweens.js"></script>
  <script src="js/studies/timelines.js"></script>
  <script src="js/studies/easing.js"></script>
  <script src="js/studies/scroll.js"></script>
  <script src="js/studies/drag.js"></script>
  <script src="js/studies/svg.js"></script>
  <script src="js/studies/text.js"></script>
  <script src="js/studies/render.js"></script>
  <script src="js/studies/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
